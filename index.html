<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Як дістати Колю Лемака — Общага</title>
<style>
:root{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1b1726;color:#fff;
 font-family:-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}
#hudTop{position:absolute;left:0;right:0;top:0;padding:calc(var(--top) + 4px) calc(var(--r) + 8px) 4px calc(var(--l) + 8px);
 background:linear-gradient(#000c,#0006 80%,#0000);pointer-events:none;z-index:5}
#hudTop .row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.pill{background:#0008;border:1px solid #fff3;border-radius:12px;padding:3px 8px;font-weight:700;font-size:14px;white-space:nowrap}
#lives{letter-spacing:1px}
#timer.warn{color:#ff6b6b;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.4}}
.anger{flex:1;min-width:70px;display:flex;align-items:center;gap:6px}
.anger span{font-size:12px;font-weight:700;white-space:nowrap;opacity:.9}
.bar{flex:1;height:12px;border-radius:7px;background:#0009;border:1px solid #fff5;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7b2e,#ff2e2e);transition:width .4s}
.hbtn{pointer-events:auto;background:#0009;border:1px solid #fff4;border-radius:10px;width:34px;height:30px;font-size:16px;padding:0;line-height:28px}
#status{font-size:12px;margin-top:3px;opacity:.95;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudBot{position:absolute;left:0;right:0;bottom:0;padding:6px calc(var(--r) + 8px) calc(var(--bot) + 6px) calc(var(--l) + 8px);
 background:linear-gradient(#0000,#0007 25%,#000c);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
#inv{display:flex;gap:5px;pointer-events:auto}
#inv .slot{width:42px;height:42px;border-radius:10px;background:#fff1;border:1px dashed #fff5;display:flex;align-items:center;justify-content:center;padding:0}
#inv .slot.full{background:#fff3;border:1px solid #ffd23f}
#inv canvas{width:36px;height:36px}
#hint{flex:1;font-size:13px;line-height:1.25;text-shadow:0 1px 2px #000;min-height:32px;display:flex;align-items:center}
#screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 padding:calc(var(--top) + 10px) calc(var(--r) + 10px) calc(var(--bot) + 10px) calc(var(--l) + 10px);background:#120f1ccc}
.card{background:linear-gradient(#2d2540,#1f1a2e);border:2px solid #ffd23f55;border-radius:20px;box-shadow:0 10px 40px #000a;
 max-width:620px;width:100%;max-height:100%;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:18px 20px;text-align:center}
.card h1{margin:4px 0 2px;font-size:30px;line-height:1.05;color:#ffd23f;text-shadow:0 3px 0 #b5442b,0 6px 12px #000}
.card h2{margin:4px 0 8px;font-size:24px;color:#ffd23f}
.card p{margin:6px 0;font-size:15px;line-height:1.4;opacity:.95}
.sub{font-size:14px;opacity:.8}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn{background:linear-gradient(#ffd23f,#f5a623);color:#2a1a00;border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #a86a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a00}
.btn.sec{background:linear-gradient(#5d5378,#463d5e);color:#fff;box-shadow:0 4px 0 #2a2340}
.rules{text-align:left;font-size:14px;line-height:1.45;padding-left:20px;margin:6px 0}
.rules li{margin:5px 0}
.portrait{display:block;margin:0 auto;width:150px;height:150px}
.list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{display:flex;align-items:center;gap:4px;background:#fff1;border-radius:10px;padding:3px 8px 3px 3px;font-size:13px}
.chip canvas{width:28px;height:28px}
.stats{font-size:16px;line-height:1.6}
.stats b{color:#ffd23f}
@media (max-height:440px){
 .pill{font-size:12px;padding:2px 6px}.hbtn{width:30px;height:26px;font-size:14px;line-height:24px}
 #status{font-size:11px;margin-top:1px}#inv .slot{width:34px;height:34px}#inv canvas{width:30px;height:30px}
 #hint{font-size:12px;min-height:26px}.anger span{display:none}
 .card{padding:10px 14px}.card h1{font-size:24px}.card p{font-size:13px;margin:4px 0}.portrait{width:96px;height:96px}
 .btn{padding:9px 18px;font-size:16px}.btns{margin-top:8px}
}
@media (max-width:480px){.anger span{display:none}.pill{font-size:12px;padding:2px 6px}#hudTop .row{gap:5px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hudTop" class="hidden">
 <div class="row">
  <div class="pill" id="lives">❤️❤️❤️</div>
  <div class="pill" id="lvl">Рівень 1</div>
  <div class="pill" id="timer">3:30</div>
  <div class="anger"><span>Злість Колі</span><div class="bar"><i id="angerFill"></i></div></div>
  <div class="pill" id="score">0</div>
  <button class="hbtn" id="btnSound" aria-label="Звук">🔊</button>
  <button class="hbtn" id="btnPause" aria-label="Пауза">⏸</button>
 </div>
 <div id="status"></div>
</div>
<div id="hudBot" class="hidden"><div id="inv"></div><div id="hint"></div></div>
<div id="screen"></div>
<script>
'use strict';
/* =====================================================================
   ЗВУКИ / SOUNDS — як додати свої файли
   ---------------------------------------------------------------------
   Кожен звук у грі має "слот" (назву нижче). Якщо для слота немає
   файлу — грає синтезований звук (WebAudio), тож гра завжди має звук.

   Варіант 1 (найпростіший, коли гра лежить на сайті/сервері):
     покладіть файл у папку  sounds/  поруч з index.html з назвою слота:
        sounds/kolya_angry.mp3      (або .m4a)
     Гра сама спробує його знайти (SOUND_AUTOLOAD = true).
     На file:// (відкрито як локальний файл) автопошук вимкнено — тоді
     використовуйте варіант 2 або 3.

   Варіант 2: впишіть шлях вручну в SOUND_FILES:
        kolya_angry: 'sounds/kolya_angry.mp3',
     Можна кілька варіантів — гра вибиратиме випадково:
        kolya_angry: ['sounds/angry1.mp3', 'sounds/angry2.mp3'],

   Варіант 3 (працює навіть як один файл без папки): вставте base64:
        kolya_angry: 'data:audio/mpeg;base64,SUQzBAAAAA...',

   Формат: MP3 або M4A(AAC), моно, 44.1 кГц, 0.5–2.5 с, без тиші на
   початку, гучність нормалізована (~ -1 dB пік). WAV теж працює, але
   важчий. OGG у старому Safari НЕ працює.

   Якщо для реакції Колі (kolya_slip, kolya_spit...) немає свого файлу,
   але є kolya_angry — буде грати kolya_angry (ланцюжок fallback).
   ===================================================================== */
const SOUND_FILES = {
  // --- Голос Колі (сюди найкраще вставити запис Ярослава) ---
  kolya_angry:       null, // Коля розлючений після будь-якої пастки (загальний)
  kolya_caught_you:  null, // "Попався, студенте!" — Коля впіймав гравця
  kolya_suspicious:  null, // "Хм?.. Хто тут?" — Коля щось помітив
  kolya_slip:        null, // посковзнувся на банані
  kolya_spit:        null, // виплюнув солоний чай
  kolya_yuck:        null, // шкарпетки в борщі — "Фу-у!"
  kolya_stuck:       null, // приклеївся до крісла
  kolya_scream:      null, // будильник о 5:00 — крик
  kolya_shiver:      null, // холодна вода — "Б-р-р-р!"
  kolya_green:       null, // став зеленим від зеленки
  kolya_laugh:       null, // зловтішний сміх, коли впіймав
  // --- Ефекти ---
  prank_success:     null, // пастка спрацювала (джингл)
  prank_place:       null, // гравець поставив пастку
  item_pickup:       null, // підібрав предмет
  alarm_clock:       null, // дзвінок будильника
  hide:              null, // сховався
  ui_click:          null, // кнопка
  level_win:         null, // рівень пройдено
  game_over:         null, // програш
  timer_warning:     null, // мало часу
};
const SOUND_AUTOLOAD = true;          // шукати sounds/<слот>.mp3 / .m4a автоматично (тільки http/https)
const SOUND_FOLDER = 'sounds/';
const SOUND_EXTENSIONS = ['mp3', 'm4a'];
const SOUND_FALLBACK = {               // якщо для слота нема файлу — спробувати файл іншого слота
  kolya_slip:'kolya_angry', kolya_spit:'kolya_angry', kolya_yuck:'kolya_angry', kolya_stuck:'kolya_angry',
  kolya_scream:'kolya_angry', kolya_shiver:'kolya_angry', kolya_green:'kolya_angry', kolya_laugh:'kolya_caught_you'
};

/* ============================ SOUND ENGINE ============================ */
const Snd = (() => {
  let ac = null, out = null, unlocked = false, loading = false;
  let muted = false;
  try { muted = localStorage.getItem('kolya.muted') === '1'; } catch (e) {}
  const buffers = {};       // slot -> [AudioBuffer]
  const loaded = {};        // slot -> source descriptions (for debug)
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
      out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
    }
    if (ac.state === 'suspended' && ac.resume) ac.resume().catch(() => {});
    if (!unlocked) {
      try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
      unlocked = true;
      loadFiles();
    }
    return ac;
  }
  function decode(ab) { return new Promise((res, rej) => { try { const p = ac.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); } catch (e) { rej(e); } }); }
  async function fetchBuf(url) {
    const r = await fetch(url, { cache: 'force-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return decode(await r.arrayBuffer());
  }
  async function loadFiles() {
    if (loading) return; loading = true;
    const http = /^https?:$/.test(location.protocol);
    const names = Object.keys(SOUND_FILES);
    await Promise.all(names.map(async name => {
      let src = SOUND_FILES[name];
      const list = src ? (Array.isArray(src) ? src : [src]) : [];
      for (const u of list) { try { (buffers[name] = buffers[name] || []).push(await fetchBuf(u)); (loaded[name] = loaded[name] || []).push(u.slice(0, 40)); } catch (e) { console.warn('Sound load failed', name, e.message); } }
      if (!list.length && SOUND_AUTOLOAD && http) {
        for (const ext of SOUND_EXTENSIONS) {
          try { buffers[name] = [await fetchBuf(SOUND_FOLDER + name + '.' + ext)]; loaded[name] = [SOUND_FOLDER + name + '.' + ext]; break; } catch (e) {}
        }
      }
    }));
  }
  function playBuf(b, vol = 1) { const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = vol; s.buffer = b; s.connect(g); g.connect(out); s.start(); }
  function env(g, t, a, d, v) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(f0, f1, dur, type = 'sine', vol = 0.2, delay = 0, vib = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib[0]; lg.gain.value = vib[1]; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + .05); }
    env(g, t, 0.01, dur, vol); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  let nbuf = null;
  function noise(dur, vol = 0.2, type = 'lowpass', freq = 1000, delay = 0, q = 1, f1 = 0) {
    if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nbuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q;
    env(g, t, 0.01, dur, vol); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur + .05);
  }
  // мультяшний «голос»: пилкоподібна хвиля через форманти голосних
  function voice(pitches, dur, vowel = 'a', vol = 0.25, delay = 0, vib = 6) {
    const F = { a: [800, 1200], o: [500, 900], u: [350, 700], e: [500, 1800], i: [300, 2300], m: [250, 1000] }[vowel];
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(), mix = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(pitches[0], t);
    pitches.forEach((p, i) => { if (i) o.frequency.linearRampToValueAtTime(p, t + dur * i / (pitches.length - 1)); });
    const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib; lg.gain.value = pitches[0] * 0.04; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + .1);
    F.forEach((fr, i) => { const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fr; b.Q.value = 6; o.connect(b); const bg = ac.createGain(); bg.gain.value = i ? 0.6 : 1; b.connect(bg); bg.connect(mix); });
    mix.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * 2.2, t + 0.03); g.gain.setValueAtTime(vol * 2.2, t + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const SYNTH = {
    ui_click: () => tone(700, 900, .06, 'square', .06),
    item_pickup: () => { tone(520, 1040, .12, 'triangle', .2); tone(1320, 1320, .12, 'triangle', .15, .1); },
    prank_place: () => { noise(.08, .2, 'bandpass', 2500, 0, 3); noise(.08, .2, 'bandpass', 1800, .15, 3); tone(300, 200, .12, 'square', .07, .3); },
    prank_success: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .16, 'triangle', .2, i * .09)); tone(1046, 1568, .3, 'square', .06, .36); },
    kolya_angry: () => { voice([170, 140, 110], .55, 'a', .25); voice([130, 95], .35, 'o', .2, .5); },
    kolya_caught_you: () => { voice([180, 200], .18, 'a', .25); voice([260, 300, 240], .35, 'a', .28, .22); },
    kolya_suspicious: () => voice([150, 150, 210], .45, 'm', .22),
    kolya_slip: () => { tone(1400, 250, .45, 'sine', .18); noise(.25, .45, 'lowpass', 400, .45); voice([260, 180], .3, 'o', .2, .5); },
    kolya_spit: () => { noise(.35, .3, 'highpass', 1500, 0, 1, 4000); voice([160, 120], .35, 'u', .2, .35); },
    kolya_yuck: () => voice([140, 110, 130, 90], .7, 'e', .25),
    kolya_stuck: () => { tone(150, 420, .15, 'sine', .25); tone(420, 150, .2, 'sine', .25, .15); tone(150, 420, .15, 'sine', .2, .45); voice([200, 260, 180], .45, 'a', .22, .6); },
    kolya_scream: () => voice([300, 520, 600, 420], .8, 'a', .28, 0, 9),
    kolya_shiver: () => { for (let i = 0; i < 8; i++) voice([180 + (i % 2) * 30], .09, 'u', .18, i * .1, 30); },
    kolya_green: () => { [392, 370, 349, 311].forEach((f, i) => tone(f, f * (i == 3 ? .9 : 1), i == 3 ? .6 : .25, 'sawtooth', .09, i * .27, i == 3 ? [6, 6] : 0)); },
    kolya_laugh: () => { for (let i = 0; i < 4; i++) voice([200 - i * 10, 170 - i * 10], .14, 'a', .22, i * .17); },
    alarm_clock: () => { for (let i = 0; i < 6; i++) tone(1800, 1800, .07, 'square', .08, i * .12); },
    hide: () => noise(.3, .2, 'bandpass', 600, 0, 2, 2400),
    level_win: () => { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, f, .2, 'triangle', .22, i * .13)); },
    game_over: () => { [392, 330, 262, 196].forEach((f, i) => tone(f, f, .35, 'triangle', .22, i * .3)); },
    timer_warning: () => tone(880, 880, .1, 'square', .07),
  };
  function play(name, vol = 1) {
    if (muted || !ac || ac.state !== 'running') return;
    try {
      let n = name, b = buffers[n];
      while ((!b || !b.length) && SOUND_FALLBACK[n]) { n = SOUND_FALLBACK[n]; b = buffers[n]; }
      if (b && b.length) { playBuf(b[Math.floor(Math.random() * b.length)], vol); return; }
      if (SYNTH[name]) SYNTH[name]();
    } catch (e) { console.warn('sound', e); }
  }
  return {
    ensure, play,
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('kolya.muted', muted ? '1' : '0'); } catch (e) {} return muted; },
    debug: () => ({ state: ac && ac.state, loaded: Object.assign({}, loaded) }),
  };
})();

/* ============================ UTILITIES ============================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; }
function shade(h, t) { return t < 0 ? mix(h, '#000000', -t) : mix(h, '#ffffff', t); }
const FONT = '-apple-system,"SF Pro Rounded",system-ui,"Segoe UI",Roboto,Arial,sans-serif';

/* ============================ WORLD ============================ */
const WW = 1280, WH = 640;
const FLOOR_Y = [590, 300];      // f=0 нижній поверх, f=1 верхній
const CEIL_Y = [316, 30];
const STAIR = { bx: 28, tx: 182 }; // низ сходів (f0) і верх (f1)
const ROOMS = [
  { id: 'stairs', name: 'Сходи', f: -1, x0: 0, x1: 200, wall: '#8e8ba3' },

const cv = $('game'), ctx = cv.getContext('2d');
let SW = 0, SH = 0, DPR = 1, S = 1, offX = 0, offY = 0, viewTop = 0, viewBot = 0, VW = WW;
const cam = { x: 0, manualUntil: 0 };
let bgCache = null, bgKey = '';
function resize() {
  SW = window.innerWidth; SH = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  const hudOn = !$('hudTop').classList.contains('hidden');
  viewTop = hudOn ? Math.max(0, $('hudTop').offsetHeight - 10) : 0; viewBot = hudOn ? Math.max(0, $('hudBot').offsetHeight - 8) : 0;
  const availH = Math.max(100, SH - viewTop - viewBot);
  const sFit = Math.min(SW / WW, availH / WH);
  const sPort = Math.min(availH / WH, SW / 500);
  S = Math.max(sFit, sPort);
  VW = SW / S;
  offY = viewTop + Math.max(0, (availH - WH * S) / 2);
  offX = VW >= WW ? (SW - WW * S) / 2 : 0;
  const key = S.toFixed(4) + 'x' + DPR; if (key !== bgKey) { bgKey = key; buildBg(); }
  updateCamera(0, true);
}
function buildBg() {
  const k = S * DPR;
  bgCache = document.createElement('canvas'); bgCache.width = Math.ceil(WW * k); bgCache.height = Math.ceil(WH * k);
  const c = bgCache.getContext('2d'); c.scale(k, k); drawBuilding(c);
}
function updateCamera(dt, force) {
  if (VW >= WW) { cam.x = 0; return; }
  if (performance.now() < cam.manualUntil && !force) return;
  const focus = G.mode === 'menu' ? K.x : P.x;
  const target = clamp(focus - VW / 2, 0, WW - VW);
  cam.x = force ? target : lerp(cam.x, target, Math.min(1, dt * 4));
}
const w2s = (x, y) => [offX + (x - cam.x) * S, offY + y * S];
const s2w = (x, y) => [(x - offX) / S + cam.x, (y - offY) / S];

function resetKolya(level) {

/* ============================ UPDATE ============================ */
function updateKolya(dt) {
  const L = curLevel();
  K.phase += dt * (K.state === 'walk' ? 9 * (L.speed / 90) : 4);
  if (K.angryT > 0) { K.angryT -= dt; if (Math.random() < dt * 6) burst(K.x + K.facing * 2, K.y - 150, 'angry'); }
  if (K.bubble) { K.bubble.t -= dt; if (K.bubble.t <= 0) K.bubble = null; }
  switch (K.state) {
    case 'walk': {
      const px = K.x, sp = L.speed * (K.angryT > 0 ? 1.15 : 1);
      const arrived = stepEntity(K, dt, sp);
      if (G.mode === 'play' && G.pranks.banana === 'armed' && K.f === 0 && !K.climbing) {
        const bx = PRANKS.banana.x; if ((px - bx) * (K.x - bx) <= 0 && px !== K.x) { K.x = bx; K.queue = []; K.resumeWalk = true; startReaction('banana'); break; }
      }
      if (arrived) startActivity();
      break;
    }
    case 'act':
      K.actT -= dt;
      if (K.act.pose === 'sleep' && Math.random() < dt * 0.8) burst(K.x - 50, FLOOR_Y[1] - 90, 'zzz');
      if (K.act.pose === 'cook' && Math.random() < dt * 4) burst(252, FLOOR_Y[0] - 116, 'steam');
      if (K.act.pose === 'shower' && Math.random() < dt * 20) burst(716, FLOOR_Y[1] - 200, 'splash');
      if (K.act.pose === 'shower' && Math.random() < dt * 3) burst(706, FLOOR_Y[1] - 160, 'steam');
      if (K.act.pose === 'look') K.facing = Math.sin(K.actT * 3) > 0 ? 1 : -1;
      if (K.actT <= 0) nextActivity();
      break;
    case 'react':
      K.reactT -= dt;
      if (K.react.anim === 'yuck' && Math.random() < dt * 5) burst(K.x, K.y - 140, 'stink');
      if (K.react.anim === 'shiver' && Math.random() < dt * 6) burst(K.x, K.y - 150, 'ice');
      if (K.react.trigger === 'shower' && Math.random() < dt * 20) burst(716, FLOOR_Y[1] - 200, 'splash');
      if (K.reactT <= 0) {
        if (K.queue.length) startReaction(K.queue.shift());
        else { K.react = null; if (K.resumeWalk && K.path.length) K.state = 'walk'; else if (K.resumeWalk) startActivity(); else nextActivity(); K.resumeWalk = false; if (Math.random() < 0.6) say(K, pick(ANGRY_LINES), 2); }
      }
      break;
    case 'gloat':
      K.gloatT -= dt;
      if (K.gloatT <= 0) { if (K.path.length) K.state = 'walk'; else nextActivity(); }
      break;
  }
  if (G.mode !== 'play') return;
  const busy = K.state === 'react' || K.state === 'gloat' || (K.state === 'act' && (K.act.id === 'sleep' || K.act.id === 'shower'));
  const kr = roomAt(K.x, K.f), pr = roomAt(P.x, P.f);
  const sees = !busy && P.state !== 'hidden' && pr !== 'proom' && kr === pr && P.invuln <= 0 && !P.caughtT;
  if (sees) {

  if (K.susp > 0.4 && G.mode === 'play') { const g = c.createRadialGradient(SW / 2, SH / 2, Math.min(SW, SH) * 0.3, SW / 2, SH / 2, Math.max(SW, SH) * 0.7); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,0,0,' + (K.susp * 0.35) + ')'); c.fillStyle = g; c.fillRect(0, 0, SW, SH); }
}
function render() {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#1b1726'; c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(S * DPR, 0, 0, S * DPR, (offX - cam.x * S) * DPR, offY * DPR);
  if (bgCache) c.drawImage(bgCache, 0, 0, WW, WH);
  drawWorldDynamic(c);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScreenSpace(c);
}

/* ============================ MAIN LOOP ============================ */
let last = performance.now(), frames = 0;
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; frames++;
  try {
    if (G.mode === 'play') {
      G.t += dt; G.time -= dt;
      if (G.hintT > 0) G.hintT -= dt;
      if (G.flash > 0) G.flash -= dt;
      updatePlayer(dt); updateKolya(dt); updateParticles(dt);
      if (G.time <= 20 && G.time > 0) { G.warnT -= dt; if (G.warnT <= 0) { Snd.play('timer_warning'); G.warnT = 5; } }
      if (G.pendingEnd) { G.pendingEnd.t -= dt; if (G.pendingEnd.t <= 0) { const pe = G.pendingEnd; G.pendingEnd = null; endLevel(pe.type === 'win', pe.reason); } }
      else if (G.time <= 0) { G.time = 0; endLevel(false, 'time'); }
      updateHud();
    } else if (G.mode === 'menu') { G.t += dt; updateKolya(dt); updateParticles(dt); }
    updateCamera(dt);
    render();
  } finally { requestAnimationFrame(loop); }
}

window.__game = { G, K, P, PRANKS, LEVELS, startLevel, tapAt, w2s, Snd, interactables, doInteract, nextActivity, startActivity, endLevel, get frames() { return frames; } };
resize(); updSndBtn(); menu(); requestAnimationFrame(loop);
